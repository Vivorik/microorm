name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Once a week: the benchmark job below is slow and its result is informational.
    - cron: '43 5 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Integration tests run Testcontainers, which needs a working Docker daemon.
      - name: Verify
        run: mvn --batch-mode clean verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Benchmark find-by-id
        # JMH forks a JVM and needs a real classpath, so exec:java is not enough here.
        run: |
          mvn --batch-mode -q test-compile dependency:build-classpath \
            -Dmdep.outputFile=target/cp.txt -Dmdep.includeScope=test
          java -cp "target/classes:target/test-classes:$(cat target/cp.txt)" \
            org.openjdk.jmh.Main io.microorm.benchmark.FindByIdBenchmark \
            -bm avgt -wi 5 -i 5 -w 2s -r 3s -f 2 -tu us